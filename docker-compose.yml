version: '3.8'

services:

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    
    command: ["uvicorn", "phishguard.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - PYTHONUNBUFFERED=1

 
  test:
    build: .
    volumes:
      - .:/app
    
    command: ["python", "-m", "pytest", "-v"]