version: '3.8'

services:

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    
    command: ["uvicorn", "analyzer.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      - PYTHONUNBUFFERED=1

 
  test:
    build: .
    volumes:
      - .:/app
    
    # RNF-06: o harness grava o log em logs/ (volume montado no diretório do projeto)
    command: ["bash", "scripts/run_harness.sh"]